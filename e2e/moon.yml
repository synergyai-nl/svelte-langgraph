$schema: 'https://moonrepo.dev/schemas/project.json'

language: typescript
stack: infrastructure
type: automation

fileGroups:
  sources:
    - 'src/**/*'
    - 'mocks/**/*'
    # Configs
    - '**/*.config.*'
    # Other files
    - '**/*.{md,mdx,yml,yaml,json}'

tasks:
  lint:
    command: eslint .
    inputs:
      - '@group(sources)'
      # Root configs, any format
      # - '/eslint.config.js'

  lint-fix:
    extends: lint
    args:
      - '--cache'
      - '--fix'
    local: true

  format:
    command: prettier
    inputs:
      - '@group(sources)'
      - '.prettierignore'
      - '.prettierrc'
      # Root configs, any format
      # - '/.prettierignore'
      # - '/.prettierrc'
    args:
      - '.'
      - '--check'

  format-write:
    extends: format
    args:
      - '.'
      - '--cache'
      - '--write'
    local: true
    options:
      mergeArgs: 'replace'

  install-playwright:
    command: playwright install chromium --with-deps
    options:
      internal: true
      cache: true
    inputs: []

  typecheck:
    command:
      - 'tsc'
      # Use incremental builds with project references
      - '--build'
      # Always use pretty output
      - '--pretty'
    inputs:
      - '@group(sources)'
      - 'tsconfig.json'
    outputs:

  oidc-mock:
    # The OIDC provider for local development (`moon :dev :oidc-mock`); see mocks/oidc.ts.
    # AUTH_OIDC_AUDIENCE comes from the root .env, as for the backend.
    command: 'node mocks/oidc.ts'
    preset: server
    options:
      envFile: '/.env'

  oidc-mock-e2e:
    extends: oidc-mock
    # The refresh specs drive the mock through /__test__/settings; only this task exposes it.
    args: ['--test-controls']
    options:
      envFile: '/.env.e2e'

  test:
    command: playwright test
    deps:
      - install-playwright
      - backend:setup
      - frontend:build
    inputs:
      - '@group(sources)'
      - '$CI'

  test-ui:
    extends: test
    preset: server
    args:
      - '--ui'
