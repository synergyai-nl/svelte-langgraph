services:
  frontend:
    ports:
      - "3000:3000"
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    env_file:
      - path: .env
        required: false
      # App-specific overrides; later entries win, but only among env_file
      # entries: the `environment:` block below always takes precedence, so
      # PUBLIC_LANGGRAPH_API_URL is set from the compose shell/project .env
      # (via interpolation), not from these files.
      - path: "apps/frontend/.env"
        required: false
    environment:
      PUBLIC_LANGGRAPH_API_URL: "${PUBLIC_LANGGRAPH_API_URL:-http://host.docker.internal:2026}"

  backend:
    ports:
      - "2026:2026"
    build: apps/backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/aegra"
      AUTH_TYPE: "custom"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg18
    environment:
      # Match Aegra's built-in POSTGRES_* defaults so the backend works even
      # when DATABASE_URL is absent from .env.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aegra
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aegra"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
