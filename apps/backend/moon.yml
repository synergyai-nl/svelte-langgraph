# https://moonrepo.dev/docs/config/project
$schema: "https://moonrepo.dev/schemas/project.json"

language: python
stack: backend
type: application

fileGroups:
  sources:
    - 'src/**/*'
    # Configs
    - '**/*.config.*'
    # Other files
    - '**/*.{md,mdx,yml,yaml,json}'
  tests:
    - 'tests/**/*'
    - 'e2e/**/*'

tasks:
  setup:
    # Used by E2E to ensure dependencies are installed before starting backend server and mocks.
    command: noop
  format:
    command: "ruff format"
    args: "--check"
    inputs:
      - '@group(sources)'
      - '@group(tests)'
  format-write:
    command: "ruff format"
    local: true
  lint:
    command: "ruff check"
    inputs:
      - '@group(sources)'
      - '@group(tests)'
  lint-fix:
    extends: lint
    args: "--fix"
    local: true
  typecheck:
    command: "pyright"
    inputs:
      - '@group(sources)'
      - '@group(tests)'
  ai-mock:
    command: "ai-mock server 2>&1"
    preset: "server"
    env:
      NO_COLOR: "true"
  ai-mock-e2e:
    command: "uvicorn slow_mock:app --host 127.0.0.1 --port 8100 2>&1"
    preset: "server"
    env:
      NO_COLOR: "true"
      MOCK_STREAM_DELAY: "0.05"
  oidc-mock:
    command: "oidc-provider-mock --port 8080 --host localhost --user test-user 2>&1"
    preset: "server"
    env:
      NO_COLOR: "true"
  postgres:
    command: "docker compose -f ../../docker-compose.yml up -d --wait postgres"
    local: true
    options:
      cache: false
  dev:
    command: "uv run uvicorn aegra_api.main:app --host localhost --port 2026 --reload 2>&1"
    preset: "watcher"
    deps:
      - postgres
    env:
      # Aegra defaults to noop auth, which would silently disable OIDC and
      # per-user isolation if AUTH_TYPE is missing from a pre-existing .env.
      AUTH_TYPE: "custom"
    options:
      envFile: '/.env'
  serve-e2e:
    # Remove and recreate the tmpfs-backed postgres-e2e container so every
    # E2E run starts from a fresh, empty database.
    script: "docker compose -f ../../docker-compose.yml rm -sf postgres-e2e && docker compose -f ../../docker-compose.yml up -d --wait postgres-e2e && uv run uvicorn aegra_api.main:app --host localhost --port 2026 2>&1"
    preset: "server"
    options:
      envFile: '/.env.e2e'
  build:
    command: "docker build -t svelte-langgraph-backend --pull ."
    deps:
      - lint
      - typecheck
  up:
    command: "docker compose -f ../../docker-compose.yml up --build backend postgres"
    preset: "server"
    deps:
      - build
  test:
    command: "pytest"
    args: 
      - "-v"
    inputs:
      - '@group(sources)'
      - '@group(tests)'
    options:
      outputStyle: "stream"
  test-cov:
    extends: test
    args: 
      - "--cov=svelte_langgraph --cov-branch --cov-report lcov --cov-report term --cov-report html"
