$schema: 'https://moonrepo.dev/schemas/project.json'

language: typescript
stack: frontend
type: application

fileGroups:
  sources:
    - 'src/**/*'
    # Configs
    - '**/*.config.*'
    # Other files
    - '**/*.{md,mdx,yml,yaml,json}'
  tests:
    - 'tests/**/*'
    - 'e2e/**/*'
  messages:
    - 'project.inlang'
    - 'messages'

tags: ['vite', 'vitest', 'sveltekit']

tasks:
  clean:
    # Also wipe .svelte-kit: a stale generated/server/internal.js bakes an old
    # __sveltekit_<version_hash> into the SSR bundle while the client pass computes
    # a fresh one from live config — splitting the build and breaking hydration.
    command: 'rm -rf build .svelte-kit'
    options:
      cache: false

  paraglide:
    command: 'pnpm run paraglide'
    inputs:
      - '@group(messages)'
      - 'package.json'
    outputs:
      - 'src/lib/paraglide'

  build:
    deps:
      - clean
      - paraglide
    inputs:
      - '@group(sources)'
    outputs:
      - 'build'
      - '.svelte-kit'

  # These tasks read generated SvelteKit and Paraglide files, so run them after
  # `build` has replaced everything removed by the uncached `clean`.
  check:
    deps:
      - build

  lint:
    command: eslint .
    deps:
      - build
    inputs:
      - '@group(messages)'
      - '@group(sources)'
      - '@group(tests)'
      # Root configs, any format
      # - '/eslint.config.js'

  lint-fix:
    extends: lint
    args:
      - '--cache'
      - '--fix'
    local: true

  format:
    command: prettier
    inputs:
      - '@group(messages)'
      - '@group(sources)'
      - '@group(tests)'
      - '.prettierignore'
      - '.prettierrc'
      # Root configs, any format
      # - '/.prettierignore'
      # - '/.prettierrc'
    args:
      - '.'
      - '--check'

  format-write:
    extends: format
    args:
      - '.'
      - '--cache'
      - '--write'
    local: true
    options:
      mergeArgs: 'replace'

  test:
    deps:
      - build
    args:
      - '--silent'
      - 'passed-only'

  test-cov:
    deps:
      - build
    args:
      - '--coverage.reporter text'
      - '--coverage.reporter lcov'
      - '--coverage.include src'
      - '--coverage.exclude "**/*.(test|spec).*"'
      - '--coverage.exclude src/lib/paraglide'
      - '--coverage.exclude src/lib/components/ui'
    inputs:
      - $GITHUB_ACTIONS

  test-ui:
    extends: test-cov
    args:
      - '--ui'
      - '--watch'
      - '--coverage.reporter html'
    preset: 'server'

  dev:
    options:
      envFile: '/.env'

  preview:
    options:
      envFile: '/.env'

  serve-e2e:
    extends: preview
    options:
      envFile: '/.env.e2e'
