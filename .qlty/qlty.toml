config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true


[[plugin]]
name = "actionlint"

[[plugin]]
name = "bandit"

# eslint, prettier and ruff are deliberately NOT run through qlty: moon already
# owns them (frontend/e2e `lint` and `format`, backend `lint`) at the versions
# pinned by pnpm-lock.yaml / uv.lock. qlty resolves its own copies instead --
# it reads exact JS tool versions only from package-lock.json / yarn.lock, and
# this is a pnpm-only repo -- so each one needs a hand-maintained `version =`
# pin and runs in a sandbox whose dependency graph differs from ours. That
# duplicates the check and periodically breaks for reasons unrelated to the
# code. qlty keeps the plugins below, which run analyses moon does not.
# See SLG-130 / #265.

[[plugin]]
name = "hadolint"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "radarlint-iac"
mode = "monitor"

[[plugin]]
name = "radarlint-python"
mode = "comment"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "zizmor"

[[triage]]
match.plugins = ["bandit"]
match.rules = ["B101"]
set.ignored = true

# trufflehog's "Lob" detector fires on apps/backend/tests/test_models.py, which
# contains no credential: its only key-shaped literal is the placeholder
# "test-api-key" that the whole backend suite uses, and a scan of the branch
# for credential-shaped strings (`(test|live|sk|pk)_...`, long base64/hex runs)
# turns up nothing. The finding is also not reproducible with the CLI's own
# trufflehog build -- `qlty check --filter=trufflehog` over these files reports
# no issues locally -- so the exact trigger string could not be pinned down;
# it began appearing only after a Qlty Cloud-side plugin update, on a file that
# had not changed.
#
# Scoped to the single offending file rather than the plugin, or even the backend
# test tree, so a real Lob key committed anywhere else -- including in another
# backend test -- still fails the build. See PR #288.
[[triage]]
match.plugins = ["trufflehog"]
match.rules = ["Lob"]
match.file_patterns = ["apps/backend/tests/test_models.py"]
set.ignored = true
