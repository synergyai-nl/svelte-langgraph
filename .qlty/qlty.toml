config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true


[[plugin]]
name = "actionlint"

[[plugin]]
name = "bandit"

# eslint is deliberately NOT run through qlty: moon already runs the identical
# eslint.config.js for apps/frontend and e2e (see their moon.yml `lint` tasks)
# at the lockfile-pinned eslint 9.31.0. qlty's driver stages a copy of those
# configs into its own sandbox and resolves its own eslint (10.x as of
# 2026-08), which both duplicates the check and mismatches the repo's major
# version. See SLG-130.

[[plugin]]
name = "hadolint"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "prettier"
version = "3.6.2"
prefix = "e2e"

[[plugin]]
name = "prettier"
version = "3.6.2"
extra_packages = [
  "prettier-plugin-svelte@3.4.0",
  "prettier-plugin-tailwindcss@0.6.14",
]
prefix = "apps/frontend"

[[plugin]]
name = "radarlint-iac"
mode = "monitor"

[[plugin]]
name = "radarlint-python"
mode = "comment"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "ruff"
drivers = [
  "lint",
]

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "zizmor"

[[triage]]
match.plugins = ["bandit"]
match.rules = ["B101"]
set.ignored = true
