config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true


[[plugin]]
name = "actionlint"

[[plugin]]
name = "bandit"

# eslint, prettier and ruff are deliberately NOT run through qlty: moon already
# owns them (frontend/e2e `lint` and `format`, backend `lint`) at the versions
# pinned by pnpm-lock.yaml / uv.lock. qlty resolves its own copies instead --
# it reads exact JS tool versions only from package-lock.json / yarn.lock, and
# this is a pnpm-only repo -- so each one needs a hand-maintained `version =`
# pin and runs in a sandbox whose dependency graph differs from ours. That
# duplicates the check and periodically breaks for reasons unrelated to the
# code. qlty keeps the plugins below, which run analyses moon does not.
# See SLG-130 / #265.

[[plugin]]
name = "hadolint"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "radarlint-iac"
mode = "monitor"

[[plugin]]
name = "radarlint-python"
mode = "comment"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "zizmor"

[[triage]]
match.plugins = ["bandit"]
match.rules = ["B101"]
set.ignored = true

# False positive: neither test file holds a credential (placeholder keys / title fixtures),
# and it doesn't reproduce locally with the CLI's own trufflehog build. Scoped to these files,
# not the plugin/tree, so a real Lob key elsewhere still fails the build. See PR #288.
[[triage]]
match.plugins = ["trufflehog"]
match.rules = ["Lob"]
match.file_patterns = [
  "apps/backend/tests/test_models.py",
  "apps/backend/tests/test_title.py",
]
set.ignored = true
