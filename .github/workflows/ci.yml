name: "CI"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions: {}

env:
  DOCKER_IMAGE_NAME: ghcr.io/synergyai-nl/svelte-langgraph-frontend

jobs:
  ci-job:
    name: "CI Job"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    permissions:
      contents: read       # checkout
      checks: write        # run-report-action
      pull-requests: write # run-report-action, moon-ci-retrospect
      statuses: write      # moon-ci-retrospect
      actions: write       # setup-toolchain cache
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@v0
        with:
          cache-base: main
          auto-install: true
      - run: moon ci --color
      - uses: moonrepo/run-report-action@v1
        if: success() || failure()
        with:
          access-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: appthrust/moon-ci-retrospect@v2
        if: success() || failure()
      - name: Upload backend coverage
        uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: apps/backend/coverage.lcov
          incomplete: true
          add-prefix: apps/backend/
          format: lcov
      - name: Upload frontend coverage
        uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: apps/frontend/coverage/lcov.info
          incomplete: true
          add-prefix: apps/frontend/
          format: lcov
      - name: Mark coverage upload complete
        uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          command: complete
  build:
    name: "Docker Build"
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout
      packages: write # push to ghcr.io
    outputs:
      image_version: ${{ steps.meta.outputs.version }}
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v5
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # - name: Set up QEMU
      #   uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_NAME }}
          tags: type=raw,value=build-${{ github.run_number }}-{{sha}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: "./apps/frontend/Dockerfile"
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        env:
          # No progress indicators for downloads
          BUILDKIT_PROGRESS: plain

  e2e:
    name: "E2E"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.58.1-noble  # keep in sync with @playwright/test in e2e/pnpm-lock.yaml
      options: --init --ipc=host
    permissions:
      contents: read   # checkout
      actions: write   # setup-toolchain cache
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install OS prerequisites for proto toolchain
        run: apt-get update && apt-get install -y --no-install-recommends unzip xz-utils
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: moonrepo/setup-toolchain@v0
        with:
          cache-base: main
          auto-install: true
      - name: Run E2E tests
        run: moon e2e:test --color
      - name: Upload Playwright report
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

  ci:
    name: "CI"
    runs-on: ubuntu-latest
    needs: [ci-job, build, e2e]
    if: always()
    steps:
      - run: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}

  deploy:
    name: "Deploy"
    runs-on: ubuntu-latest
    needs:
      - build
      - ci
    environment: demo
    concurrency:
      group: demo
      cancel-in-progress: true
    if: success() && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Nexaa
        run: |
          curl -L https://github.com/nexaa-cloud/nexaa-cli/releases/download/v1.0.37/nexaa-v1.0.37-linux-amd64.tar.gz | tar xz
          chmod +x nexaa-v1.0.37-linux-amd64/nexaa-cli
          nexaa-v1.0.37-linux-amd64/nexaa-cli login --username admin@synergyai.nl
          nexaa-v1.0.37-linux-amd64/nexaa-cli container modify \
            --namespace svelte-langgraph \
            --name frontend \
            --image ${{ env.DOCKER_IMAGE_NAME }}:${{ needs.build.outputs.image_version }}
        env:
          TILAA_PASSWORD: ${{ secrets.TILAA_PASSWORD }}
